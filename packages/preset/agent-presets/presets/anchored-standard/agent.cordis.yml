# The `anchored-standard` agent preset: the Standard tool set behind a Minimal
# first request.
#
# A session's first model request decides its trajectory, and what that request
# shows — the API-visible tool catalog and the injected context — decides it more
# than any later instruction. This preset therefore bootstraps with the Minimal
# condition: a complete Minimal-aligned system prompt, the persistent shell plus
# `str_replace_editor`, and no automatically injected workspace or skill context.
# The first durable promotion signal (a tool call or the first assistant message)
# opens the session to a small resident catalog; heavier Standard tools are one
# `dev_tool_search` call away. Phase state is derived from durable session events,
# so resume and reload keep it, and a compaction returns the session to the
# controlled phase until a new promotion signal exists.
#
# This composition is the `standard` composition with the phase rows below added
# and the shell rows replaced, so the two presets stay comparable. The
# phase-control rows must stay FIRST: waterfall after-next transforms apply in
# reverse registration order, so the earliest registration is the outermost
# transform.

# ── phase control ───────────────────────────────────────────────────────────

# Closes both injection paths while the session is unpromoted: the assembled
# prompt's runtime-context contributions are blanked and the pre-step waterfall
# keeps only the claimed message batch plus `allowKinds` entries (a user skill
# gesture survives; the AGENTS.md digest, the skill catalog, time context, and
# every other automatic injection are stripped). The gate opens on the first
# durable promotion signal and re-closes on `compaction/end`.
- id: context-gate
  name: ./context-gate.mjs
  config:
    promoteOn: either
    includeSubagents: true
    allowKinds: [skill-invocation]

# Narrows the assembled tool catalog per phase: the bootstrap pair while
# unpromoted, then the bootstrap pair plus the discovery tools plus whatever the
# model unlocked through `dev_tool_search`. `includeSubagents` keeps a subagent's
# own first request on the bootstrap pair, matching the context gate above.
- id: tool-bootstrap
  name: ./tool-bootstrap.mjs
  config:
    promoteOn: either
    includeSubagents: true
    # Post-compaction work set: the model is mid-task and must be able to keep
    # working, without being handed the whole Standard catalog.
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]

# ── identity ────────────────────────────────────────────────────────────────

# Minimal's own persona text, complete, with runtime context suppressed: the
# bootstrap request carries no harness identity block, no tool guidance, and no
# workspace digest. Tool schemas and their runtime enforcement are unaffected.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The workspace instruction files are not injected as a digest. After promotion
# the session gets one short hint that they exist, once, derived from durable
# events so a restart cannot inject it twice.
- id: instruction-hint
  name: ./instruction-hint.mjs
  config:
    promoteOn: either
    includeSubagents: true

# On-demand discovery: the promoted catalog stays small, and heavier Standard
# tools are unlocked by exact name through this tool.
- id: dev-tool-search
  name: ./dev-tool-search.mjs

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` and the shell executors stay host-plane, as in `standard`. Both
# one-shot shell tools register the same names the persistent shell publishes in
# this preset's layer, so they are disabled where the persistent tool is mounted:
# `bash` never (the persistent bash owns that name), `pwsh` on win32 (the
# persistent pwsh owns it there). The persistent shell is the bootstrap shell.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform === 'win32'

# The Minimal preset's shell: a PTY-backed persistent shell, schema-identical to
# the `minimal` preset's group so the first request exposes Minimal's own shell
# schema. The PTY registry is an agent-owned service, so it lives in an
# entry-local realm; the backend still consumes the host sandbox policy and
# subprocess implementation, and the tool registers into this preset's layer.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# ── filesystem ──────────────────────────────────────────────────────────────

# These register into the host `tools` registry and provide nothing, so they need
# no realm; the `fs` service and its sandbox policy stay in the host. The
# bootstrap editor consumes that same sandboxed service — it is exported by the
# reference preset over a bare local filesystem, which would put an unconfined
# write path behind a model-facing tool.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-apply-patch
  name: '@deepseek-ai/dsh-tool-apply-patch'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The Minimal preset's second bootstrap tool. It is resident from request #1, so
# the bootstrap pair can edit files without the `write`/`edit` tools, which stay
# unlockable.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# `skill-filesystem` contributes local-root discovery for this preset's agents;
# `skill-search` adds the discovery pair (`skill_search`, `skill_load`) that
# replaces the injected skill catalog while the session is unpromoted.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: skill-search
  name: ./skill-search.mjs

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is its correct
# lifetime rather than a workaround.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm. A compaction ends the current phase epoch: the session
# returns to the controlled catalog until a new promotion signal.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its backends stay host-plane; this preset
# contributes the delegation tools. `workflows` is agent-owned, so every row that
# reaches it shares one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
